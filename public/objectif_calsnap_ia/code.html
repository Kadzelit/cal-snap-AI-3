<body class="bg-background text-on-background antialiased min-h-screen flex flex-col items-center justify-center p-container-padding">
<!-- Main Container -->
<main class="w-full max-w-md mx-auto flex flex-col gap-section-gap">
<!-- Header Section -->
<header class="text-center space-y-unit">
<h1 class="font-display-xl text-display-xl text-on-background">Quel est votre objectif ?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Choisissez un objectif principal pour commencer à personnaliser votre expérience.</p>
</header>
<!-- Goals Selection Container -->
<div class="flex flex-col gap-stack-gap w-full">
<!-- Card 1: Perdre du poids -->
<button class="w-full group text-left bg-surface-container-high rounded-card p-card-inner-padding shadow-diffused hover:-translate-y-1 transition-transform duration-200 focus:outline-none focus:ring-2 focus:ring-primary-container relative overflow-hidden flex items-center justify-between">
<div class="relative z-10 flex items-center gap-stack-gap">
<div class="w-12 h-12 rounded-full bg-surface-lowest flex items-center justify-center shadow-diffused">
<span class="material-symbols-outlined text-primary-container text-2xl" data-icon="trending_down">trending_down</span>
</div>
<div>
<h2 class="font-heading-md text-heading-md text-on-background">Perdre du poids</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Réduire ma masse grasse</p>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary-container transition-colors relative z-10" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Card 2: Maintenir mon poids -->
<button class="w-full group text-left bg-surface-container-high rounded-card p-card-inner-padding shadow-diffused hover:-translate-y-1 transition-transform duration-200 focus:outline-none focus:ring-2 focus:ring-primary-container relative overflow-hidden flex items-center justify-between">
<div class="relative z-10 flex items-center gap-stack-gap">
<div class="w-12 h-12 rounded-full bg-surface-lowest flex items-center justify-center shadow-diffused">
<span class="material-symbols-outlined text-secondary-container text-2xl" data-icon="balance">balance</span>
</div>
<div>
<h2 class="font-heading-md text-heading-md text-on-background">Maintenir mon poids</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Stabiliser ma forme actuelle</p>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary-container transition-colors relative z-10" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Card 3: Prendre du muscle -->
<button class="w-full group text-left bg-surface-container-high rounded-card p-card-inner-padding shadow-diffused hover:-translate-y-1 transition-transform duration-200 focus:outline-none focus:ring-2 focus:ring-primary-container relative overflow-hidden flex items-center justify-between">

</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary-container transition-colors relative z-10" data-icon="chevron_right">chevron_right</span>
