<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

                    "inverse-surface": "#313030",
                    "primary": "#006e2a",

                    "surface-bright": "#fcf9f8",
                    "on-tertiary-fixed-variant": "#7e2a24",
                    "inverse-on-surface": "#f3f0ef",

                    "tertiary-fixed-dim": "#ffb4ab",

                    "on-secondary-fixed-variant": "#6a3b00",

            "borderRadius": {

            "spacing": {
                    "section-gap": "32px",
                    "unit": "8px",

                    "stack-gap": "16px"
            },
            "fontFamily": {
                    "metric-large": ["Plus Jakarta Sans"],
                    "label-caps": ["Manrope"],

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        /* Custom hide scrollbar */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased min-h-screen flex flex-col relative pb-[100px]">
<!-- Top Navigation (Contextual: Back Button & Progress) -->
<header class="px-container-padding py-4 flex items-center justify-between z-10 bg-background/80 backdrop-blur-md sticky top-0">
<button aria-label="Retour" class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container hover:bg-surface-container-high transition-colors text-on-surface">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex gap-2">
<div class="h-1.5 w-8 rounded-full bg-surface-container-high"></div>
<div class="h-1.5 w-8 rounded-full bg-surface-container-high"></div>
<div class="h-1.5 w-8 rounded-full bg-primary-container"></div>
<div class="h-1.5 w-8 rounded-full bg-surface-container-high"></div>
</div>
<div class="w-10 h-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Main Content -->
<main class="px-container-padding pt-4 flex-1 flex flex-col">
<!-- Header -->
<div class="mb-section-gap">
<h1 class="font-heading-lg text-heading-lg text-on-background mb-unit">Votre niveau d'activité</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Cela nous aide à calculer vos besoins caloriques journaliers avec précision.</p>
</div>
<!-- Activity Level Options -->
<div class="flex flex-col gap-stack-gap">
<!-- Option: Sédentaire -->
<label class="group relative cursor-pointer block">
<input class="peer sr-only" name="activity_level" type="radio" value="sedentary"/>
<div class="bg-surface-container p-card-inner-padding rounded-2xl border-2 border-transparent peer-checked:border-primary-container peer-checked:bg-surface-container-low transition-all duration-200 flex items-center gap-4 shadow-[0px_4px_20px_rgba(26,26,26,0.04)] hover:-translate-y-0.5">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface group-hover:bg-primary-container group-hover:text-on-primary transition-colors peer-checked:bg-primary-container peer-checked:text-on-primary">
<span class="material-symbols-outlined">weekend</span>
</div>
<div class="flex-1">
<h3 class="font-heading-md text-heading-md text-on-background">Sédentaire</h3>
<p class="font-body-md text-body-md text-on-surface-variant mt-1 leading-snug">Travail de bureau, peu ou pas d'exercice régulier.</p>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary-container peer-checked:bg-primary-container transition-colors">
<span class="material-symbols-outlined text-[16px] text-on-primary opacity-0 peer-checked:opacity-100 fill">check</span>
</div>
</div>
</label>
<!-- Option: Léger -->
<label class="group relative cursor-pointer block">
<input checked="" class="peer sr-only" name="activity_level" type="radio" value="light"/>
<div class="bg-surface-container p-card-inner-padding rounded-2xl border-2 border-transparent peer-checked:border-primary-container peer-checked:bg-surface-container-low transition-all duration-200 flex items-center gap-4 shadow-[0px_4px_20px_rgba(26,26,26,0.04)] hover:-translate-y-0.5">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface group-hover:bg-primary-container group-hover:text-on-primary transition-colors peer-checked:bg-primary-container peer-checked:text-on-primary">
<span class="material-symbols-outlined">directions_walk</span>
</div>
<div class="flex-1">
<h3 class="font-heading-md text-heading-md text-on-background">Léger</h3>
<p class="font-body-md text-body-md text-on-surface-variant mt-1 leading-snug">Exercice léger ou marche 1 à 3 jours par semaine.</p>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary-container peer-checked:bg-primary-container transition-colors">
<span class="material-symbols-outlined text-[16px] text-on-primary opacity-0 peer-checked:opacity-100 fill">check</span>
</div>
</div>
</label>
<!-- Option: Actif -->
<label class="group relative cursor-pointer block">
<input class="peer sr-only" name="activity_level" type="radio" value="active"/>
<div class="bg-surface-container p-card-inner-padding rounded-2xl border-2 border-transparent peer-checked:border-primary-container peer-checked:bg-surface-container-low transition-all duration-200 flex items-center gap-4 shadow-[0px_4px_20px_rgba(26,26,26,0.04)] hover:-translate-y-0.5">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface group-hover:bg-primary-container group-hover:text-on-primary transition-colors peer-checked:bg-primary-container peer-checked:text-on-primary">
<span class="material-symbols-outlined">directions_run</span>
</div>
<div class="flex-1">
<h3 class="font-heading-md text-heading-md text-on-background">Actif</h3>
<p class="font-body-md text-body-md text-on-surface-variant mt-1 leading-snug">Exercice modéré ou sport 3 à 5 jours par semaine.</p>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary-container peer-checked:bg-primary-container transition-colors">
<span class="material-symbols-outlined text-[16px] text-on-primary opacity-0 peer-checked:opacity-100 fill">check</span>
</div>
</div>
</label>
<!-- Option: Très Actif -->
<label class="group relative cursor-pointer block">
<input class="peer sr-only" name="activity_level" type="radio" value="very_active"/>
<div class="bg-surface-container p-card-inner-padding rounded-2xl border-2 border-transparent peer-checked:border-primary-container peer-checked:bg-surface-container-low transition-all duration-200 flex items-center gap-4 shadow-[0px_4px_20px_rgba(26,26,26,0.04)] hover:-translate-y-0.5">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface group-hover:bg-primary-container group-hover:text-on-primary transition-colors peer-checked:bg-primary-container peer-checked:text-on-primary">
<span class="material-symbols-outlined">fitness_center</span>
</div>
<div class="flex-1">
<h3 class="font-heading-md text-heading-md text-on-background">Très Actif</h3>
<p class="font-body-md text-body-md text-on-surface-variant mt-1 leading-snug">Exercice intense ou sport 6 à 7 jours par semaine.</p>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary-container peer-checked:bg-primary-container transition-colors">
<span class="material-symbols-outlined text-[16px] text-on-primary opacity-0 peer-checked:opacity-100 fill">check</span>
</div>
</div>
</label>
</div>
</main>
<!-- Fixed Bottom Action -->
<div class="fixed bottom-0 left-0 w-full p-container-padding bg-gradient-to-t from-background via-background to-transparent z-20">
<button class="w-full bg-primary-container text-on-primary-container font-heading-md text-heading-md py-4 px-6 rounded-full shadow-[0px_4px_20px_rgba(26,26,26,0.04)] active:scale-95 transition-transform duration-200 flex items-center justify-center gap-2">
            Calculer mon plan
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</body></html>
