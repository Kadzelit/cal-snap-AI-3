<body class="bg-background text-on-background min-h-screen flex flex-col antialiased selection:bg-primary-container/30">
<!-- Header / Progress -->
<header class="px-container-padding py-6 flex items-center justify-between">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-background">arrow_back</span>
</button>
<div class="flex gap-2">
<div class="w-10 h-1.5 rounded-full bg-primary-container"></div>
<div class="w-10 h-1.5 rounded-full bg-surface-variant"></div>
<div class="w-10 h-1.5 rounded-full bg-surface-variant"></div>
</div>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content -->
<main class="flex-1 px-container-padding flex flex-col gap-section-gap pb-[120px]">
<!-- Header Text -->
<div class="pt-4">
<h1 class="font-display-xl text-display-xl text-on-background mb-4">Parlez-nous de vous</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Ces informations permettront à l'IA de calculer vos besoins nutritionnels précis.</p>
</div>
<!-- Form Area -->
<form class="flex flex-col gap-8">
<!-- Sexe Selection -->
<div class="flex flex-col gap-3">
<label class="font-label-caps text-label-caps text-on-surface-variant">SEXE</label>
<div class="grid grid-cols-2 gap-4">
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="sexe" type="radio" value="homme"/>
<div class="flex flex-col items-center justify-center p-card-inner-padding bg-surface-container rounded-xl border-2 border-transparent peer-checked:border-primary-container peer-checked:bg-primary-container/5 hover:bg-surface-container-high transition-all">
<span class="material-symbols-outlined text-3xl mb-2 text-on-background peer-checked:text-primary-container" style="font-variation-settings: 'FILL' 1;">male</span>
<span class="font-body-md text-body-md font-semibold text-on-background">Homme</span>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="sexe" type="radio" value="femme"/>
<div class="flex flex-col items-center justify-center p-card-inner-padding bg-surface-container rounded-xl border-2 border-transparent peer-checked:border-primary-container peer-checked:bg-primary-container/5 hover:bg-surface-container-high transition-all">
<span class="material-symbols-outlined text-3xl mb-2 text-on-background peer-checked:text-primary-container" style="font-variation-settings: 'FILL' 1;">female</span>
<span class="font-body-md text-body-md font-semibold text-on-background">Femme</span>
</div>
</label>
</div>
</div>
<!-- Age Input -->
<div class="flex flex-col gap-3">
<label class="font-label-caps text-label-caps text-on-surface-variant">ÂGE</label>
<div class="relative group">
<input class="w-full bg-surface-container rounded-xl p-card-inner-padding py-6 font-metric-large text-metric-large text-center text-on-background border-2 border-transparent focus:border-outline outline-none placeholder:text-on-surface-variant/30 transition-colors appearance-none" placeholder="28" type="number"/>
</div>
</div>
<!-- Height & Weight Grid -->
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-3">
<label class="font-label-caps text-label-caps text-on-surface-variant text-center">TAILLE (CM)</label>
<input class="w-full bg-surface-container rounded-xl p-card-inner-padding py-6 font-metric-large text-metric-large text-center text-on-background border-2 border-transparent focus:border-outline outline-none placeholder:text-on-surface-variant/30 transition-colors appearance-none" placeholder="175" type="number"/>
</div>
<div class="flex flex-col gap-3">
<label class="font-label-caps text-label-caps text-on-surface-variant text-center">POIDS (KG)</label>
<input class="w-full bg-surface-container rounded-xl p-card-inner-padding py-6 font-metric-large text-metric-large text-center text-on-background border-2 border-transparent focus:border-outline outline-none placeholder:text-on-surface-variant/30 transition-colors appearance-none" placeholder="72" type="number"/>
</div>
</div>
</form>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full px-container-padding py-8 bg-gradient-to-t from-background via-background/95 to-transparent z-10 pointer-events-none">
<button class="pointer-events-auto w-full bg-primary-container text-on-primary-container rounded-[28px] py-5 font-heading-md text-heading-md shadow-[0px_4px_20px_rgba(26,26,26,0.04)] hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-2">
<span>Suivant</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
