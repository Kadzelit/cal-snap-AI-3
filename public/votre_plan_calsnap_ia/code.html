<body class="bg-background min-h-screen text-on-background flex flex-col font-body-md selection:bg-primary-container selection:text-on-primary">
<!-- Main Content Canvas (Navigation suppressed for Onboarding Intent) -->
<main class="flex-1 w-full max-w-md mx-auto px-container-padding py-section-gap flex flex-col justify-between relative">
<!-- Header -->
<div class="mt-8 mb-section-gap">
<h1 class="font-display-xl text-display-xl text-on-background text-center">Votre plan personnalisé</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant text-center mt-4">Conçu spécifiquement pour atteindre vos objectifs.</p>
</div>
<!-- Bento Grid Data Display -->
<div class="flex-1 flex flex-col gap-stack-gap">
<!-- Hero Card: Calorie Target -->
<div class="bg-surface-container rounded-[20px] p-card-inner-padding flex flex-col items-center justify-center shadow-[0px_4px_20px_rgba(26,26,26,0.04)] relative overflow-hidden">
<!-- Decorative Glow -->
<div class="absolute -top-12 -right-12 w-32 h-32 bg-primary-container/20 rounded-full blur-3xl pointer-events-none"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider mb-3">Objectif Quotidien</span>
<div class="flex items-baseline gap-2">
<span class="font-metric-large text-metric-large text-primary-container">2 150</span>
<span class="font-body-md text-body-md text-on-surface-variant">kcal / jour</span>
</div>
</div>
<!-- Macros Grid -->
<div class="grid grid-cols-2 gap-stack-gap">
<!-- Protéines (Full Width) -->
<div class="col-span-2 bg-surface-container rounded-[20px] p-card-inner-padding shadow-[0px_4px_20px_rgba(26,26,26,0.04)]">
<div class="flex justify-between items-center mb-4">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">fitness_center</span>
<span class="font-heading-md text-heading-md text-on-background">Protéines</span>
</div>
<span class="font-heading-lg text-heading-lg text-on-background">160g</span>
</div>
<div class="w-full h-2 bg-surface-variant rounded-full overflow-hidden">
<div class="w-[35%] h-full bg-primary-container rounded-full"></div>
</div>
</div>
<!-- Glucides (Half Width) -->
<div class="col-span-1 bg-surface-container rounded-[20px] p-card-inner-padding shadow-[0px_4px_20px_rgba(26,26,26,0.04)] flex flex-col justify-between aspect-square">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary-container" style="font-variation-settings: 'FILL' 1;">grain</span>
<span class="font-body-lg text-body-lg text-on-background font-semibold">Glucides</span>
</div>
<div class="mt-auto">
<span class="font-heading-lg text-heading-lg text-on-background block mb-3">215g</span>
<div class="w-full h-2 bg-surface-variant rounded-full overflow-hidden">
<div class="w-[45%] h-full bg-secondary-container rounded-full"></div>
</div>
</div>
</div>
<!-- Lipides (Half Width) -->
<div class="col-span-1 bg-surface-container rounded-[20px] p-card-inner-padding shadow-[0px_4px_20px_rgba(26,26,26,0.04)] flex flex-col justify-between aspect-square">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary-container" style="font-variation-settings: 'FILL' 1;">water_drop</span>
<span class="font-body-lg text-body-lg text-on-background font-semibold">Lipides</span>
</div>
<div class="mt-auto">
<span class="font-heading-lg text-heading-lg text-on-background block mb-3">70g</span>
<div class="w-full h-2 bg-surface-variant rounded-full overflow-hidden">
<div class="w-[20%] h-full bg-secondary-container rounded-full opacity-80"></div>
</div>
</div>
</div>
</div>
</div>

<div class="mt-12 mb-4 w-full">
<button class="w-full bg-primary-container text-on-primary rounded-[28px] py-4 font-heading-md text-heading-md text-center hover:opacity-90 active:scale-95 transition-all shadow-[0px_4px_20px_rgba(0,200,83,0.2)] flex items-center justify-center gap-2">
                C'est parti !

</button>
